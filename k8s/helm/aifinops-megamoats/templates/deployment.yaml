apiVersion: apps/v1
kind: Deployment
metadata:
  name: aifinops-megamoats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aifinops-megamoats
  template:
    metadata:
      labels:
        app: aifinops-megamoats
    spec:
      containers:
      - name: agent
        image: "{{ .Values.image }}"
