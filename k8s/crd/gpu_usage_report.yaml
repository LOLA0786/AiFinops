apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuusagereports.aifinops.dev
spec:
  scope: Cluster
  group: aifinops.dev
  names:
    kind: GPUUsageReport
    plural: gpuusagereports
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            gpuUtilization:
              type: number
            memoryUsed:
              type: number
            pod:
              type: string
            node:
              type: string
