name: Auto Merge FinOps PRs

on:
  pull_request:

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load metrics
        id: metrics
        run: |
          if [ -f training_metrics.json ]; then
            MAE=$(jq '.MAE' training_metrics.json)
            echo "mae=$MAE" >> $GITHUB_OUTPUT
          else
            echo "mae=9999" >> $GITHUB_OUTPUT
          fi

      - name: Auto-merge if model stable
        if: steps.metrics.outputs.mae < 5
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
