name: Pre-commit Checks

on:
  pull_request:
  push:
    branches: [main, aifinops-bootstrap]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files
